/* Interactive widgets embedded from widgets/<chapter>/*.html.
   They live in an iframe so their CSS (which styles body/table/button
   unscoped) cannot leak into the page, and so several copies on one
   page do not collide on element ids. The height below is a first guess;
   each widget posts its real height and the listener at the bottom of this
   file applies it. */
iframe.widget-frame {
  display: block;
  width: 100%;
  height: 440px;      /* replaced by the widget's own reported height */
  border: 0;          /* the widget draws its own frame */
  background: transparent;
  margin: 1.2rem 0 0;
}
/* Inside a .thmsim box the frame sits flush; the box supplies the padding. */
.thmbox-simulation iframe.widget-frame { margin: 0.5rem 0 0.2rem; }
.thmbox {
  border-inline-start: 4px solid #9ca3af;
  background: #fafafa;
  border-radius: 4px;
  padding: 0.6rem 1rem;
  margin: 1rem 0;
}
.thmbox > :first-child { margin-top: 0; }
.thmbox > :last-child { margin-bottom: 0; }
.thmbox-definition  { border-color: #4f46e5; background: #eef2ff; }
.thmbox-theorem     { border-color: #0d9488; background: #f0fdfa; }
.thmbox-proposition { border-color: #0d9488; background: #f0fdfa; }
.thmbox-lemma       { border-color: #14b8a6; background: #f0fdfa; }
.thmbox-corollary   { border-color: #14b8a6; background: #f0fdfa; }
.thmbox-example     { border-color: #ea580c; background: #fff7ed; }

   is to a theorem, and the reader already reads that grey as "the working". */

.thmbox-solution    { border-color: #64748b; background: #f8fafc; }

/* ---------------------------------------------------------------------------
   Math must never inherit the page's RTL direction. <html dir="rtl"> makes the
   whole document a right-to-left bidi context, and two things go wrong inside it:

   1. The renderer's own output boxes lay out right-to-left, so a formula mixed
      into a Hebrew sentence reads backwards.
   2. Until MathJax runs, the page literally contains the raw source \( ... \).
      If the CDN is slow or unreachable that source is what stays on screen, and
      the bidi algorithm reorders it -- the same failure the widgets have with
      KaTeX (see mathrender.js).

   `unicode-bidi: isolate` makes every formula its own bidi context: it can
   neither be reordered by the Hebrew around it nor reorder that Hebrew.
   --------------------------------------------------------------------------- */
span.math,
mjx-container,
.katex,
.katex-display {
  direction: ltr;
  unicode-bidi: isolate;
}
mjx-container *,
.katex * {
  direction: ltr;
}

/* Keep inline math on one line. This backs up the MathJax linebreak config
   below; see the comment there for why v4 needs it at all. Display math is
   left alone -- MathJax gives it its own scroll box. */
mjx-container:not([display="true"]),
.katex:not(.katex-display) {
  white-space: nowrap;
}

<script>
/* ---------------------------------------------------------------------------
   MathJax line breaking.

   Quarto now loads mathjax@4, and v4 switched on automatic line breaking that
   v3 did not do:

     * inline math may be broken at a relation or a binary operator, so a short
       formula such as \( \phi : U \to V \) comes out split after the U;
     * display math wider than the column is broken instead of being left to
       run on.

   Inside an RTL paragraph a break in the middle of a formula does not read as
   a wrap, it reads as a mistake. So turn the AUTOMATIC breaking off:
   `linebreaks.inline = false` for inline math, and `displayOverflow = scroll`
   so that over-wide display math gets a scroll box rather than being chopped.

   Breaks we wrote ourselves are unaffected: `\\` inside aligned/cases/matrix
   still starts a new row, which is the "unless specifically required" case.

   Both `output` and `chtml` are set because v4 accepts these keys on the
   generic output block and on the specific output jax, and tex-chtml.js loads
   CHTML. The more specific one wins; setting both costs nothing.

   This has to run before the MathJax script does. That script carries `defer`,
   so it runs after parsing, while this inline script runs during parsing --
   hence anywhere in the head is early enough.
   --------------------------------------------------------------------------- */
window.MathJax = {
  output: {
    displayOverflow: "scroll",
    linebreaks: { inline: false }
  },
  chtml: {
    displayOverflow: "scroll",
    linebreaks: { inline: false }
  }
};
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".tf-quiz").forEach(function (quiz) {
    var correct = quiz.getAttribute("data-correct");
    var feedback = quiz.querySelector(".tf-feedback");
    quiz.querySelectorAll(".tf-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        quiz.querySelectorAll(".tf-opt").forEach(function (b) {
          b.classList.remove("correct", "incorrect");
        });
        if (btn.getAttribute("data-val") === correct) {
          btn.classList.add("correct");
          if (feedback) feedback.textContent = "✓ נכון!";
        } else {
          btn.classList.add("incorrect");
          if (feedback) feedback.textContent = "✗ לא מדויק — קראו את ההסבר ונסו שוב.";
        }
        /* Opt-in via a bare data-reveal attribute (ported from the BGU book): answering
           opens the next foldable solution, so the reasoning appears once the reader
           has committed. Found by document order, not by id: a Div carrying an id
           together with .thmsol .foldable crashes Quarto's main.lua. */
        if (quiz.hasAttribute("data-reveal")) {
          var box = null;
          for (var node = quiz; node && node.tagName !== "MAIN" && !box; node = node.parentElement) {
            for (var sib = node.nextElementSibling; sib && !box; sib = sib.nextElementSibling) {
              box = sib.tagName === "DETAILS" ? sib
                  : (sib.querySelector ? sib.querySelector("details") : null);
            }
          }
          if (box) box.open = true;
        }
      });
    });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function normSet(str) {
    if (!str) return [];
    return Array.from(new Set(
      str.split(/[\s,;]+/).filter(function (s) { return s.length; }).map(Number)
    )).filter(function (n) { return !Number.isNaN(n); }).sort(function (a, b) { return a - b; });
  }
  function eqSet(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }
  document.querySelectorAll(".set-quiz").forEach(function (q) {
    var answer = normSet(q.getAttribute("data-answer"));
    var input = q.querySelector(".set-input");
    var feedback = q.querySelector(".set-feedback");
    var btn = q.querySelector(".set-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      if (eqSet(normSet(input.value), answer)) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
// Widgets embedded from widgets/<chapter>/ report their own height, so the
// iframe does not need a hard-coded one (which breaks on narrow screens,
// where the control panel stacks above the plot).
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.type !== "widget-height" || typeof d.height !== "number") return;
  var frames = document.querySelectorAll("iframe.widget-frame");
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].contentWindow === e.source) {
      frames[i].style.height = Math.max(160, Math.min(2400, d.height)) + "px";
      return;
    }
  }
});
</script>
